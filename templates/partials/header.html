{% load i18n %}{% get_current_language as LANGUAGE_CODE %}
<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-header__brand" href="{% url 'pages:home' %}">{% translate "Honey Shop" %}</a>
    <div class="site-header__tools">
      <form action="{% url 'set_language' %}" method="post" class="lang-switch">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        {% get_available_languages as LANGUAGES %}
        {% for code, name in LANGUAGES %}{% if code != LANGUAGE_CODE %}
        {% get_language_info for code as language_info %}
        <button type="submit" name="language" value="{{ code }}" lang="{{ code }}" class="btn btn-ghost">{{ language_info.name_local }}</button>
        {% endif %}{% endfor %}
      </form>
      <button type="button" class="btn btn-ghost theme-toggle" data-theme-toggle hidden
              data-label-system="{% translate 'Theme: automatic' %}"
              data-label-light="{% translate 'Theme: light' %}"
              data-label-dark="{% translate 'Theme: dark' %}">
        <svg class="theme-icon theme-icon--system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg>
        <svg class="theme-icon theme-icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-icon theme-icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>
